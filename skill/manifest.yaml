skills:
- name: ps-axi-dma-capture-guard
  description: PS 端 AXI DMA 采集/发送链路检查：传输长度与点数一致性、缓存同步、提交与等待顺序、超时整帧丢弃、只取本帧有效点数。
  path: ps-axi-dma-capture-guard

- name: ps-multi-irq-config-triage
  description: PS 端多中断配置检查：GIC 初始化、优先级与触发类型、中断服务函数注册、异常向量挂载、外设侧使能顺序。
  path: ps-multi-irq-config-triage

- name: pl-vdma-display-pipeline
  description: PL 端 VDMA 显示通路检查：先问屏幕参数，再判 MM2S 方向、行/场时序、位宽链、VTG 来源、fsync、连线与像素格式能否正常显示。
  path: pl-vdma-display-pipeline
